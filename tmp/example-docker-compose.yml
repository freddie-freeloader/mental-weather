services:
  # Tailscale sidecar for secure networking
  ts-navidrome:
    image: tailscale/tailscale:latest
    hostname: navidrome-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-data-navidrome:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  # Navidrome music server
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    network_mode: service:ts-navidrome
    restart: unless-stopped
    user: "1000:1000"
    environment:
      # Basic Navidrome configuration
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_SCANINTERVAL=1h
      - ND_ENABLEINSIGHTSCOLLECTOR=false

      # S3/Performance optimizations
      - ND_SCANNER_EXTRACTOR=taglib
      - ND_TRANSCODINGCACHESIZE=150MB
      - ND_IMAGECACHESIZE=100MB

      # External integrations (optional)
      - ND_LASTFM_ENABLED=${LASTFM_ENABLED:-false}
      - ND_LASTFM_APIKEY=${LASTFM_APIKEY:-}
      - ND_LASTFM_SECRET=${LASTFM_SECRET:-}

      # Security
      - ND_PASSWORDENCRYPTIONKEY=${NAVIDROME_ENCRYPTION_KEY}
    volumes:
      - navidrome-data:/data
      - ./music-mount:/music:ro  # Read-only access to music files from rclone
    depends_on:
      - ts-navidrome
      # - rclone-s3
      - navidrome-init
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4533/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  navidrome-init:
    image: alpine:latest
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - navidrome-data:/data
    restart: "no"

volumes:
  tailscale-data-navidrome:
    driver: local
  navidrome-data:
    driver: local
  # rclone-cache:
  #   driver: local

# Optional networks for advanced setups
networks:
  default:
    name: navidrome-network

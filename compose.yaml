name: ophelias-mental-weather

configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-ophelias-mental-weather
    hostname: ophelias-mental-weather
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./tailscale-data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ophelias-backend
    network_mode: service:tailscale
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - tailscale

  frontend:
    build: ./frontend
    container_name: ophelias-frontend
    network_mode: service:tailscale
    restart: unless-stopped
    depends_on:
      - tailscale
